      padding: 10px;
      display: flex;
      gap: 10px;
      width: 100%;
    }

    a {
      text-decoration: none;
    }

    form {
      display: flex;
      gap: 10px;
      width: 100%;
    }


    .count {
      display: flex;
      align-items: center;
      justify-content: center;
    }
   
   
   
  </style>
</head>

<body>

  <div id="container" class="container">

  </div>
  <div class="sort">

    
    <form id="form">
      <input name="regexp" class="form-control" type="input" placeholder="regexp" />
      <input name="length" class="form-control" type="number" placeholder="length"  />
      <button type="submit" class="btn btn-primary" type="submit">Filter</button>
      <span class="badge text-bg-secondary count" id="J_count"></span>
    </form>
  </div>

  <script>

    const colors = {
      'a1': 'rgb(0, 105, 180)',
      'a2': 'rgb(201, 19, 82)',
      'b1': 'rgb(185, 91, 11)',
      'b2': 'rgb(26, 135, 59)',
      'c1': 'rgb(150, 77, 176)'
    };

    function shuffle(arr) {
      var l = arr.length
      var index, temp
      while (l > 0) {
        index = Math.floor(Math.random() * l)
        temp = arr[l - 1]
        arr[l - 1] = arr[index]
        arr[index] = temp
        l--
      }
      return arr
    }

   

    function getHtml(data) {
      const html = data.reduce((acc, el, idx) => {
        return acc += `
            <li class="list-group-item">
              <a
                href="https://www.oxfordlearnersdictionaries.com/definition/english/${el.text}?q=${el.text}"
                target="_blank"
              >
              <h4>
                ${el.hw}
                ${el.ox3000 ? `<span style="background-color: ${colors[el.ox3000]}!important;" class="badge text-bg-secondary">3: ${el.ox3000}</span>` : ''}
                ${el.ox5000 ? `<span style="background-color: ${colors[el.ox5000]}!important;" class="badge text-bg-secondary">5: ${el.ox5000}</span>` : ''}
              </h4>
              </a>
            </li>
        `.trim();
      }, '');
      return `
        <ul class="list-group">${html}</ul>
      `.trim()
    }


    document.querySelector('#form').addEventListener('submit', onSubmit);

    function onSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const regexp = form.regexp.value.trim();
      const length = form.length.value.trim();
      let filteredData = data;
      if (regexp) {
        const re = new RegExp(regexp, 'i');
        filteredData = filteredData.filter(el => re.test(el.hw));
      }
      if (length) {
        const len = parseInt(length, 10);
        filteredData = filteredData.filter(el => el.hw.length === len);
      }

      document.querySelector('#J_count').innerText = `Count: ${filteredData.length}`;
      
      render(filteredData)
    }
   
  
    function render(data) {
      document.querySelector('#container').innerHTML = getHtml(data);
    }

    render(data);
    
  </script>
</body>

</html>
